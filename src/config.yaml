# Site configuration
# Edit this file to control the site's content, branding, layout, and typography.

site:
  # Site name.
  # Used for the text logo and as the default page title fallback.
  name: Palo

  # Separator used in browser tab titles.
  # Example: "About | Palo"
  titleSeparator: '|'

  # Whether generated URLs should end with a trailing slash.
  # false -> /about
  # true  -> /about/
  trailingSlash: false

  # Show the dark mode toggle in the header.
  showDarkModeToggle: true

metadata:
  # Production site URL, including https://
  # Used for canonical URLs, social sharing metadata, and sitemap generation.
  siteUrl: 'https://palo.petepa.com'

  # Default title for the homepage and SEO fallbacks.
  title: 'Palo - A minimalist Astro theme for artists, musicians, and designers'

  # Default SEO description.
  description: 'Break free from generic business templates. Palo is a minimalist Astro theme by PetePa, crafted for artists, musicians, and designers. Deeply customize your colors, radius, and typography within a logic-driven framework. Build your unique digital identity at palo.petepa.com.'

  # Author name used in metadata tags.
  author: PetePa

  # Social sharing image path.
  # Put the file in /public and use a path starting with /
  image: '/social-preview-image.png'

  # Browser tab icon (favicon) path.
  # Put the file in /public and use a path starting with /
  favicon: '/favicon.svg'

branding:
  # Logo image path.
  # Leave empty to show the text logo (site.name) instead.
  # Put the file in /public and use a path starting with /
  logo: ''

  font:
    # Font family name used across the whole site.
    name: 'League Spartan'

    # Folder containing the local font files.
    # Put the files in /public and use a path starting with /
    path: '/fonts/League_Spartan/'

    # Font weights used by the design system.
    # body: paragraphs and long-form text
    # accent: navigation, buttons, labels, and other emphasized UI text
    # heading: all headings
    weights:
      body: 300
      accent: 400
      heading: 500

  colors:
    # Main brand color.
    primary: '#ff4b00'

    # Secondary brand color.
    secondary: '#632a1b'

    # Neutral base color used to derive text, borders, and surfaces.
    neutral: '#75878a'

    # Focus outline color used for accessibility states.
    outline: '#ffffff'

    # Semantic state colors.
    # Used by buttons, badges, notifications, and other status UI.
    info: '#75878a'
    success: 'green'
    warning: 'orange'
    error: 'red'

layout:
  # Whether the header stays fixed at the top of the viewport.
  # true  → the header stays fixed at the top when scrolling
  # false → the header scrolls with the page
  fixedHeader: true

  # Background opacity of the fixed header (0 = fully transparent, 1 = fully opaque).
  # Only applies when fixedHeader is true.
  headerBackgroundOpacity: 0.45

  # Blur strength of the fixed header background.
  # Set to 0 to disable the blur effect.
  # Only applies when fixedHeader is true.
  headerBackgroundBlur: 12px

  # Maximum width of the main content container.
  # Supports any valid CSS length unit such as px, rem, em, %, vw, or vh.
  containerMaxWidth: '1536px'

typography:
  # Base body font size.
  # This sets the site's root font size, so 1rem will equal this value.
  baseFontSize: '16px'

  # Global line-height multiplier.
  # Affects body text and also participates in heading line-height calculation.
  lineHeightScale: 1.0

  # Desktop navigation font size.
  # Leave empty to use the base body font size.
  navigationDesktopFontSize: '21px'

  # Mobile menu font size after the hamburger menu is expanded.
  # Leave empty to use the base body font size.
  navigationMobileFontSize: '24px'

  # Text logo font size.
  # Leave empty to use the desktop navigation font size.
  logoTextFontSize: '32px'

  # Heading size scale on small screens.
  # Formula: h1 = 1rem * scale^5 ... h6 = 1rem * scale^0
  mobileHeadingScale: 1.1

  # Heading size scale on large screens.
  # Formula: h1 = 1rem * scale^5 ... h6 = 1rem * scale^0
  desktopHeadingScale: 1.7

  # Extra multiplier for heading line-height only.
  # 1 = default, smaller = tighter, larger = looser
  headingLineHeightScale: 0.8

  # Force non-body display text to uppercase.
  # Affects headings and emphasized UI text, not paragraph content.
  uppercaseDisplayText: true
