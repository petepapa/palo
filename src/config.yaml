# ============================================================
# 基本信息 / Site Info
# 网站名称、标题分隔符、URL 格式、Header 功能开关
# Site name, title separator, URL format, header toggles
# ============================================================

site:
  name: Palo
  titleSeparator: '|'                    # 标签页标题分隔符，例如 "About | Palo" / Browser tab title separator, e.g. "About | Palo"
  trailingSlash: false                   # URL 尾部斜杠：false → /about，true → /about/ / Trailing slash: false → /about, true → /about/
  showDarkModeToggle: true               # 显示深色模式切换按钮 / Show dark mode toggle button
  showLauncher: true                     # 显示快捷启动器按钮（Cmd+K / Ctrl+K）/ Show launcher button (Cmd+K / Ctrl+K)


# ============================================================
# 导航 / Navigation
# 导航布局、固定顶部、字号与交互相关设置
# Navigation layout, sticky header, sizing, and interaction settings
# ============================================================

navigation:
  # --- 固定顶部 / Sticky Header ---
  fixedHeader: true                        # 固定顶部导航，滚动时始终可见 / Sticky header — stays visible while scrolling
  headerBackgroundOpacity: 0.45           # 背景透明度（0 全透明 → 1 不透明）/ Background opacity (0 = transparent, 1 = opaque)
  headerBackgroundBlur: 10px              # 背景模糊强度（设为 0 可关闭）/ Background blur strength (0 = disabled)

  # --- 菜单布局 / Menu Layout ---
  desktopMenuAlignment: 'center'           # 桌面端文字主菜单位置：'left' | 'center' | 'right'；不影响右侧功能图标与移动端 / Desktop text menu alignment: 'left' | 'center' | 'right'; does not affect right-side utility icons or mobile layout

  # --- 导航字号 / Navigation Font Sizes ---
  desktopFontSize: '21px'                 # 桌面端主导航 / Desktop main nav
  dropdownDesktopFontSize: '16px'         # 桌面端下拉子菜单 / Desktop dropdown
  mobileFontSize: '24px'                  # 手机端展开菜单 / Mobile expanded menu
  dropdownMobileFontSize: '21px'          # 手机端下拉子菜单 / Mobile dropdown

  # --- 导航高亮样式 / Navigation Active Style ---
  # 'wavy'      → 波浪下划线（默认）/ Wavy underline (default)
  # 'underline' → 直线下划线 / Solid underline
  # 'bold'      → 加粗，悬停时显示下划线 / Bold weight, underline on hover
  activeStyle: 'bold'


# ============================================================
# 描边 / Borders
# 全局描边粗细与主要元素分类描边设置
# Global border thickness and major element border categories
# ============================================================

border:
  globalWidth: '20px'                    # 全站默认描边粗细 / Default border width site-wide
  buttonWidth: ''                       # 按钮与按钮型链接；留空继承全局 / Buttons and button-like links; leave blank to inherit global
  formWidth: ''                         # 输入框、选择框、勾选框等表单元素；留空继承全局 / Inputs, selects, checkboxes, and other form controls; leave blank to inherit global
  surfaceWidth: ''                      # 卡片、面板、下拉菜单、信息块等容器类元素；留空继承全局 / Cards, panels, dropdowns, and other surface containers; leave blank to inherit global
  dividerWidth: ''                      # 分隔线、区块分隔边框；留空继承全局 / Dividers and section-separating borders; leave blank to inherit global


# ============================================================
# SEO & 元数据 / SEO & Metadata
# 站点 URL、默认标题、描述、作者、社交分享图、网站图标
# Site URL, default title, description, author, social image, favicon
# ============================================================

metadata:
  siteUrl: 'https://palo.petepa.com/'
  title: 'Palo - A minimalist Astro theme for artists, musicians, and designers'
  description: 'Break free from generic business templates. Palo is a minimalist Astro theme by PetePa, crafted for artists, musicians, and designers. Deeply customize your colors, radius, and typography within a logic-driven framework. Build your unique digital identity at palo.petepa.com.'
  author: PetePa
  image: '/social-preview-image.png'    # 社交分享预览图，放在 /public 下 / Social sharing image, place in /public
  favicon: '/favicon.svg'               # 浏览器标签页图标，放在 /public 下 / Favicon, place in /public


# ============================================================
# 品牌：Logo · 颜色 · 字体 / Branding: Logo · Colors · Font
# ============================================================

branding:

  # Logo：留空显示文字 Logo，填写路径显示图片（放在 /public 下）
  # Logo: leave empty to show text logo, or provide an image path (place file in /public)
  logo: ''

  # --- 颜色 / Colors ---
  colors:
    primary: '#ff4b00'                   # 主品牌色 / Primary brand color
    secondary: '#632a1b'                 # 副品牌色 / Secondary brand color
    neutral: '#75878a'                   # 中性色，用于文字、边框、背景 / Neutral color for text, borders, surfaces
    outline: '#ffffff'                   # 无障碍焦点轮廓色 / Accessibility focus outline color

    # 状态色，用于按钮、徽章、通知等 / Semantic state colors for buttons, badges, notifications
    info: '#75878a'
    success: 'green'
    warning: 'orange'
    error: 'red'

  # --- 字体 / Font ---
  font:
    name: 'League Spartan'              # 字体族名称 / Font family name
    path: '/fonts/League_Spartan/'      # 字体文件目录，放在 /public 下 / Font files folder, place in /public

    # 各场景字重 / Font weights per context
    weights:
      body: 300                         # 正文段落 / Body paragraphs
      accent: 400                       # 导航、按钮、标签等强调文字 / Navigation, buttons, labels
      heading: 500                      # 所有标题 / All headings

    # checkbox/radio 与 label 的垂直对齐微调（根据实际使用的字体调整）
    # Vertical alignment offset for checkbox/radio vs label. Adjust per font.
    capHeightOffset: '-0.05em'


# ============================================================
# 布局 / Layout
# 内容区宽度等页面结构设置
# Content width and page structure settings
# ============================================================

layout:
  containerMaxWidth: '1536px'           # 内容区最大宽度，支持 px / rem / % 等 / Max content width, accepts px, rem, %, etc.


# ============================================================
# 版式 & 文字大小 / Typography & Font Sizes
# 根字号、行高、标题缩放等全局文字设置
# Base size, line height, heading scale, and global typography
# ============================================================

typography:

  # --- 全局 / Global ---
  baseFontSize: '16px'                   # 根字号，全站 1rem = 此值 / Root font size, 1rem equals this value site-wide
  lineHeightScale: 1.0                   # 行高倍数（影响正文与标题）/ Line height multiplier (affects body and headings)
  uppercaseDisplayText: true             # 标题和强调文字是否强制大写 / Force headings and UI text to uppercase

  # --- 标题大小阶梯 / Heading Scale ---
  # 公式：h1 = 1rem × scale^5，h2 = scale^4 … 以此类推
  # Formula: h1 = 1rem × scale^5, h2 = scale^4 … and so on
  mobileHeadingScale: 1.25             # 小屏标题缩放比 / Heading scale on small screens
  desktopHeadingScale: 1.65            # 大屏标题缩放比 / Heading scale on large screens
  headingLineHeightScale: 0.85         # 标题行高微调（< 1 更紧凑，> 1 更宽松）/ Heading line height (< 1 tighter, > 1 looser)

  logoTextFontSize: '36px'                  # 文字 Logo 大小（留空跟随桌面导航字号）/ Text logo size (leave empty to inherit desktop nav size)
