# ╔══════════════════════════════════════════════════════════════╗
# ║  基本信息 / Site Info                                        ║
# ║  网站名称、标题格式、URL、Header 功能开关                      ║
# ║  Site name, title format, URL, header feature toggles        ║
# ╚══════════════════════════════════════════════════════════════╝

site:
  name: Palo
  titleSeparator: '|'         # 标签页标题分隔符，例："About | Palo" / Tab title separator, e.g. "About | Palo"
  trailingSlash: false        # URL 尾部斜杠 / Trailing slash: false → /about, true → /about/
  showDarkModeToggle: true    # 显示深色模式切换 / Show dark mode toggle
  showLauncher: trues          # 启用快捷启动器（Cmd+K / Ctrl+K），可选：false / true（默认）/ default / gradientBorder


# ╔══════════════════════════════════════════════════════╗
# ║  SEO & 元数据 / SEO & Metadata                               ║
# ║  站点地址、标题、描述、作者、分享图、图标                       ║
# ║  Site URL, title, description, author, social image, favicon  ║
# ╚══════════════════════════════════════════════════════════════╝

metadata:
  siteUrl: 'https://palo.petepa.com/'
  title: 'Palo — The Astro Theme for Creative Portfolios'
  description: 'Palo is a minimalist Astro theme for artists, musicians, and designers. Control colors, typography, and layouts from one config file. Build your creative portfolio your way.a'
  author: Pete Lee
  image: '/social-preview-image.png'  # 社交分享预览图，放 /public 下 / Social sharing image, place in /public
  favicon: '/favicon.svg'             # 标签页图标，放 /public 下 / Favicon, place in /public


# ╔══════════════════════════════════════════════════════════════╗
# ║  品牌 / Branding                                             ║
# ║  Logo · 主题色 · 状态色 · 字体                                ║
# ║  Logo · Theme colors · State colors · Font                   ║
# ╚══════════════════════════════════════════════════════════════╝

branding:

  # Logo：两个都留空 → 显示文字 Logo；填路径 → 显示图片（放 /public 下）
  # Logo: leave both empty = show text logo, path = show image (place in /public)
  logoLight: 'branding/logo-light.svg' # 浅色主题 Logo / Logo for light theme
  logoDark: 'branding/logo-dark.svg'   # 深色主题 Logo / Logo for dark theme
  logoSize: '40px'  # Logo 大小：文字为字号，图片为高度（留空跟随桌面导航字号）/ Logo size: text font-size, image height

  # ── 颜色 / Colors ────────────────────────────────────────────

  colors:
    # 品牌色 / Brand colors
    primary: '#ff4b00'    # 主品牌色 / Primary brand color
    secondary: '#632a1b'  # 副品牌色 / Secondary brand color
    neutral: '#75878a'    # 中性色（文字、边框、背景）/ Neutral (text, borders, surfaces)
    outline: '#ffffff'    # 无障碍焦点轮廓色 / Accessibility focus outline

    # 状态色（按钮、徽章、通知等）/ Semantic state colors (buttons, badges, notifications)
    info: '#177cb0'
    success: '#00bc12'
    warning: '#ffa631'
    error: '#f00056'

  # ── 字体 / Font ──────────────────────────────────────────────

  font:
    name: 'League Spartan'         # 字体族名称 / Font family name
    path: '/fonts/League_Spartan/' # 字体目录，放 /public 下 / Font folder, place in /public

    # 各场景字重 / Font weights per context
    weights:
      body: 300     # 正文 / Body paragraphs
      accent: 500   # 导航、按钮、标签等 / Navigation, buttons, labels
      heading: 600  # 所有标题 / All headings

    # checkbox / radio 与 label 的垂直对齐微调，根据实际字体调整
    # Vertical alignment offset for checkbox/radio vs label — adjust per font
    capHeightOffset: '-0.10em'


# ╔══════════════════════════════════════════════════════════════╗
# ║  导航 / Navigation                                           ║
# ║  固定顶栏、菜单布局、字号、高亮样式                            ║
# ║  Sticky header, menu layout, font sizes, active style        ║
# ╚══════════════════════════════════════════════════════════════╝

navigation:

  # ── 固定顶栏 / Sticky Header ─────────────────────────────────

  fixedHeader: true              # 固定顶部，滚动时始终可见 / Stays visible while scrolling
  minHeight: '6rem'               # 导航栏最小高度（值需大于内容高度才生效）/ Min height — only applies when > content height
  headerBackgroundOpacity: 0.45   # 背景透明度（0 全透明 → 1 不透明）/ Opacity (0 = clear, 1 = solid)
  headerBackgroundBlur: 10px      # 背景模糊（0 = 关闭）/ Blur strength (0 = disabled)
  showMobileMenuLabel: false      # 是否显示汉堡按钮旁的 Menu/Close 文字 / Show Menu/Close text next to hamburger

  # ── 菜单布局 / Menu Layout ────────────────────────────────────

  # 桌面端文字主菜单位置，不影响右侧功能图标和移动端
  # Desktop text menu position — does not affect utility icons or mobile
  desktopMenuAlignment: 'center'  # 'left' | 'center' | 'right'
  dropdownDesktopColorMode: 'inverse' # PC 下拉菜单配色：'theme' 跟随主题，'inverse' 反相 / Desktop dropdown color mode

  # ── 字号 / Font Sizes ─────────────────────────────────────────

  desktopFontSize: '24px'           # 桌面端主导航 / Desktop main nav
  dropdownDesktopFontSize: '21px'   # 桌面端下拉子菜单 / Desktop dropdown
  mobileFontSize: '30px'            # 手机端展开菜单 / Mobile expanded menu
  dropdownMobileFontSize: '24px'    # 手机端下拉子菜单 / Mobile dropdown
  mainMenuLineHeightScale: 1.25      # 主菜单竖排行高倍数，数值越大越宽松 / Main menu vertical line-height scale
  dropdownMenuLineHeightScale: 0.85  # 下拉菜单竖排行高倍数，数值越大越宽松 / Dropdown menu vertical line-height scale

  # ── 高亮样式 / Active Style ───────────────────────────────────

  # 'wavy'      → 波浪下划线（默认）/ Wavy underline (default)
  # 'underline' → 直线下划线 / Solid underline
  # 'bold'      → 加粗，悬停显示下划线 / Bold weight, underline on hover
  activeStyle: 'bold'


# ╔══════════════════════════════════════════════════════════════╗
# ║  布局 / Layout                                               ║
# ║  内容区宽度等页面结构设置                                      ║
# ║  Content width and page structure                            ║
# ╚══════════════════════════════════════════════════════════════╝

layout:
  containerMaxWidth: '1536px'  # 内容区最大宽度，支持 px / rem / % / Max content width, accepts px, rem, %


# ╔══════════════════════════════════════════════════════════════╗
# ║  版式 / Typography                                           ║
# ║  根字号、行高、大写、标题缩放                                   ║
# ║  Base size, line height, uppercase, heading scale            ║
# ╚══════════════════════════════════════════════════════════════╝

typography:

  # ── 全局 / Global ─────────────────────────────────────────────

  baseFontSize: '16px'          # 根字号，全站 1rem = 此值 / Root size, 1rem = this value site-wide
  lineHeightScale: 1.0          # 行高倍数（影响正文与标题）/ Line height multiplier
  uppercaseDisplayText: true    # 标题和强调文字强制大写 / Force headings and UI text to uppercase

  # ── 标题缩放 / Heading Scale ──────────────────────────────────

  # 公式：h1 = 1rem × scale^5，h2 = scale^4 … 以此类推
  # Formula: h1 = 1rem × scale^5, h2 = scale^4 … and so on
  mobileHeadingScale: 1.25      # 小屏标题缩放比 / Heading scale on small screens
  desktopHeadingScale: 1.65     # 大屏标题缩放比 / Heading scale on large screens
  headingLineHeightScale: 0.85  # 标题行高微调（< 1 更紧凑，> 1 更宽松）/ Heading line height (< 1 tighter, > 1 looser)


# ╔══════════════════════════════════════════════════════════════╗
# ║  描边 / Borders                                              ║
# ║  全局粗细 + 各组件独立描边，留空则继承全局                      ║
# ║  Global width + per-component overrides, empty = inherit     ║
# ╚══════════════════════════════════════════════════════════════╝

border:
  globalWidth: '0.1rem'       # 全站默认描边 / Default border width site-wide

  # ── 组件独立描边（留空 = 继承全局）/ Per-component (empty = inherit global) ──

  buttonWidth: ''             # 按钮与按钮型链接 / Buttons and button-like links
  formWidth: '0.075rem'       # 输入框、选择框、勾选框等 / Inputs, selects, checkboxes
  cardWidth: ''               # Card 卡片 / Cards
  accordionWidth: ''          # Accordion 折叠面板 / Accordion items
  tabsWidth: ''               # Tabs 标签与面板 / Tab and panel borders
  badgeWidth: '0.05rem'       # Badge 徽章 / Badges
  avatarWidth: ''            # Avatar 头像 / Avatars
  notificationWidth: ''      # Notification 通知 / Notifications
  paginationWidth: '0.1rem'   # Pagination 分页按钮 / Pagination buttons
  toggleWidth: '0.1rem'       # Toggle 切换按钮 / Toggle buttons
  mediaWidth: '0'              # 图片 / Images
  surfaceWidth: '0.05rem'           # 下拉菜单、面板等容器 / Dropdowns, panels, surfaces
  dividerWidth: '0.05rem'     # 分隔线 / Dividers


# ╔══════════════════════════════════════════════════════════════╗
# ║  圆角 / Radius                                               ║
# ║  全局大小 + 各组件独立圆角，留空则继承全局                      ║
# ║  Global size + per-component overrides, empty = inherit      ║
# ╚══════════════════════════════════════════════════════════════╝

radius:
  globalSize: '0.75rem'   # 全站默认圆角，同时驱动基础圆角比例 token / Default radius; also drives base radius scale tokens

  # ── 组件独立圆角（留空 = 继承全局）/ Per-component (empty = inherit global) ──

  buttonSize: ''          # Button、按钮型 Link / Buttons, button-like links
  formSize: ''            # Input、Textarea、Select、Checkbox 等 / Inputs, textareas, selects, checkboxes
  cardSize: '1.5rem'      # Card、Feature、CTA 等卡片型区块 / Cards, feature blocks, CTA sections
  mediaSize: ''           # 图片 / Images
  tabsSize: '1rem'        # Tabs 标签与面板（连接处保留直角）/ Tabs and panel (straight join edges preserved)
  badgeSize: '0.25rem'     # Badge 徽章（圆形与 pill 特例保留）/ Badges (circular and pill shapes intact)
  notificationSize: ''    # Notification 通知 / Notifications
  avatarSize: ''          # Avatar 方形圆角（圆形保持 50%）/ Square avatar corners (round = always 50%)
  paginationSize: '0.5rem'  # Pagination 分页按钮 / Pagination buttons
  toggleSize: '0.5rem'      # Toggle 切换按钮 / Toggle buttons
  surfaceSize: ''       # 下拉菜单、代码块、工具面板等容器 / Dropdowns, code blocks, utility panels
